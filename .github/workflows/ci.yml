name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # Run the full suite from a clean env (no ambient DEBUG) to prove the
      # suite is hermetic (ticket 006 / OX Alpha finding 6). No pipe: the
      # step's exit code must be pytest's so red tests fail the job.
      - name: Run backend test suite
        run: env -u DEBUG uv run pytest tests/ -q --cov=. --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run frontend test suite
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated backend dependencies
        working-directory: backend
        run: uv sync --dev --python 3.12
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Typecheck browser fixtures and tests
        working-directory: frontend
        run: npm run test:e2e:types
      - name: Run all 41 named browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve per-journey timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
